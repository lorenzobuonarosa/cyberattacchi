<!doctype html>
<html lang="it">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Crescita degli attacchi informatici gravi – Radar QN</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Libre+Franklin:wght@400;500;600;700&family=Newsreader:opsz,wght@6..72,400;6..72,700&display=swap">
<link rel="stylesheet" href="../assets/radar.css">
<script src="https://cdn.jsdelivr.net/npm/d3@7"></script>
<script src="../assets/radar.js"></script>
</head>
<body>
<main class="radar">
  <header>
    <h1 class="r-title">In Italia gli attacchi gravi sono cresciuti più che nel resto del mondo</h1>
    <p class="r-sub">Incidenti informatici gravi noti, indice 2021 = 100. Nel tooltip i valori assoluti</p>
  </header>

  <div class="r-big" id="big" aria-hidden="true">
    <span class="r-big__num"><span class="r-big__unit" style="font-size:44px;font-weight:700">×</span><span id="big-num">&nbsp;</span></span>
    <span class="r-big__label" id="big-label"></span>
  </div>

  <figure class="r-chart" id="chart" style="margin-top:20px"></figure>

  <footer class="r-foot">
    <span>Fonte: Clusit, Rapporto 2026 sulla sicurezza ICT in Italia</span>
    <span>Elaborazione Radar – QN</span>
  </footer>
</main>

<script>
(function () {
  var R = Radar, fmt = R.fmt;

  R.loadCSV("../data/crescita.csv").then(function (rows) {
    var data = rows.map(function (r) {
      return { anno: +r.anno, mondo: R.num(r.mondo), italia: R.num(r.italia) };
    }).filter(function (d) { return d.anno; }).sort(function (a, b) { return a.anno - b.anno; });

    var first = data[0], last = data[data.length - 1];
    var SER = [
      { k: "italia", name: "Italia", color: "var(--red)" },
      { k: "mondo", name: "Mondo", color: "var(--blue)" }
    ];
    SER.forEach(function (s) {
      s.base = first[s.k];
      s.pts = data.map(function (d, i) {
        var prev = i ? data[i - 1][s.k] : null;
        return { anno: d.anno, v: d[s.k], idx: d[s.k] / s.base * 100, varp: prev ? d[s.k] / prev - 1 : null };
      });
      s.mult = last[s.k] / s.base;
    });
    var IT = SER[0], MO = SER[1];

    // ---- Big number (calcolato dal CSV) ----
    var f1 = function (v) { return fmt(v, 1); };
    d3.select("#big-label").text("la crescita degli attacchi gravi in Italia dal " + first.anno + ", contro ×" + f1(MO.mult) + " nel mondo");
    var bigNum = d3.select("#big-num");
    if (R.reduced) bigNum.text(f1(IT.mult));
    else { bigNum.text(f1(1)); R.onFirstView(document.getElementById("big"), function () { R.countUp(bigNum, IT.mult, f1, "play"); }); }

    var host = document.getElementById("chart");
    var tip = R.tooltip(host);
    var clearActive = function () {};
    R.dismissOutside(host, function () { tip.hide(); clearActive(); });

    function varTxt(p) { return p.varp == null ? "" : " (" + (p.varp >= 0 ? "+" : "") + fmt(p.varp * 100, 1) + "%)"; }

    R.responsive(host, function (W, phase) {
      var narrow = R.isNarrow(W);
      var m = { top: 14, right: narrow ? 52 : 70, bottom: 30, left: 34 };
      var H = narrow ? 330 : 380;
      var w = W - m.left - m.right, h = H - m.top - m.bottom;

      var x = d3.scaleLinear().domain([first.anno, last.anno]).range([0, w]);
      var yMax = d3.max(IT.pts.concat(MO.pts), function (p) { return p.idx; });
      var y = d3.scaleLinear().domain([0, yMax]).nice().range([h, 0]);
      var yTicks = y.ticks(narrow ? 4 : 5);

      d3.select(host).select("svg").remove();
      var svg = d3.select(host).insert("svg", ".r-tip").attr("width", W).attr("height", H).attr("role", "img")
        .attr("aria-label", "Grafico a linee: dal " + first.anno + " al " + last.anno + " gli incidenti informatici gravi in Italia passano da " +
          fmt(first.italia, 0) + " a " + fmt(last.italia, 0) + ", " + f1(IT.mult) + " volte tanto; nel mondo da " + fmt(first.mondo, 0) + " a " +
          fmt(last.mondo, 0) + ", " + f1(MO.mult) + " volte tanto.");
      svg.append("title").text("Incidenti informatici gravi in Italia e nel mondo, indice " + first.anno + " = 100");
      var g = svg.append("g").attr("transform", "translate(" + m.left + "," + m.top + ")");

      g.append("g").attr("class", "grid").selectAll("line").data(yTicks).join("line")
        .attr("x1", 0).attr("x2", w)
        .attr("y1", function (d) { return Math.round(y(d)) + 0.5; }).attr("y2", function (d) { return Math.round(y(d)) + 0.5; })
        .attr("class", function (d) { return d === 0 ? "baseline" : null; });
      g.append("g").selectAll("text").data(yTicks).join("text").attr("class", "tick-label")
        .attr("x", -8).attr("y", function (d) { return y(d); }).attr("dy", "0.35em").attr("text-anchor", "end")
        .text(function (d) { return fmt(d, 0); });
      // linea dell'indice 100
      g.append("line").attr("x1", 0).attr("x2", w).attr("y1", Math.round(y(100)) + 0.5).attr("y2", Math.round(y(100)) + 0.5)
        .style("stroke", "var(--ink-2)").attr("stroke-dasharray", "2 3").attr("stroke-width", 1);

      var xa = g.append("g").attr("transform", "translate(0," + h + ")");
      xa.selectAll("line").data(data).join("line")
        .attr("x1", function (d) { return Math.round(x(d.anno)) + 0.5; }).attr("x2", function (d) { return Math.round(x(d.anno)) + 0.5; })
        .attr("y1", 0).attr("y2", 5).style("stroke", "var(--ink)");
      xa.selectAll("text").data(data).join("text").attr("class", "tick-label")
        .attr("x", function (d) { return x(d.anno); }).attr("y", 20).attr("text-anchor", "middle")
        .text(function (d) { return d.anno; });

      // ---- annotazioni (sotto le linee) ----
      var an = g.append("g").attr("class", "anno");
      // 1) Italia 2022: testo in alto a sinistra, linea fino al punto
      var p22 = IT.pts.find(function (p) { return p.anno === 2022; });
      if (p22) {
        var ax = x(p22.anno), ay = y(p22.idx);
        var tx = 0, tw = Math.max(130, x(2023) - 14);
        var t1 = an.append("text").attr("x", tx).attr("y", 12)
          .text("Febbraio 2022, invasione russa dell'Ucraina: parte l'ondata di attacchi hacktivisti filorussi")
          .call(R.wrap, Math.min(tw, narrow ? 150 : 220));
        var bb1 = t1.node().getBBox();
        var lx = Math.min(ax, bb1.x + bb1.width - 4);
        an.append("path").attr("d", "M" + ax + "," + (bb1.y + bb1.height + 4) + "V" + (ay - 6));
        an.append("circle").attr("cx", ax).attr("cy", ay).attr("r", 1.75);
        if (ax > bb1.x + bb1.width) {
          // linea dal fondo del testo
          an.select("path").attr("d", "M" + (bb1.x + 4) + "," + (bb1.y + bb1.height + 4) + "H" + ax + "V" + (ay - 6));
        }
      }
      // 2) Mondo 2025: testo tra le due linee, a destra
      var pm = MO.pts[MO.pts.length - 1];
      var mx = x(pm.anno), my = y(pm.idx);
      var t2 = an.append("text").attr("x", mx).attr("y", 0).attr("text-anchor", "end")
        .text("Nel primo semestre 2026 già 4.911 incidenti nel mondo")
        .call(R.wrap, narrow ? 116 : 150);
      var bb2 = t2.node().getBBox();
      // l'ultima riga del testo poggia 14px sopra il punto
      t2.attr("transform", "translate(0," + (my - 16 - (bb2.y + bb2.height)) + ")");
      an.append("line").attr("x1", mx).attr("x2", mx).attr("y1", my - 12).attr("y2", my - 5);
      R.enter(an, phase, function (s) { s.style("opacity", 0); }, function (s) { s.style("opacity", 1); }, R.DUR * 0.6);

      // ---- linee ----
      var line = d3.line().curve(d3.curveMonotoneX).x(function (p) { return x(p.anno); }).y(function (p) { return y(p.idx); });
      var paths = SER.slice().reverse().map(function (s) {
        var p = g.append("path").datum(s.pts).attr("class", "mark")
          .style("fill", "none").style("stroke", s.color).attr("stroke-width", 2.5)
          .attr("stroke-linejoin", "round").attr("stroke-linecap", "round").attr("d", line);
        var L = p.node().getTotalLength();
        R.enter(p, phase,
          function (q) { q.attr("stroke-dasharray", L + " " + L).attr("stroke-dashoffset", L); },
          function (q) { q.attr("stroke-dashoffset", 0); });
        return p;
      });

      var cross = g.append("line").attr("class", "crosshair").attr("y1", 0).attr("y2", h).style("opacity", 0);

      var allPts = [];
      SER.forEach(function (s) { s.pts.forEach(function (p) { allPts.push({ s: s, p: p }); }); });
      var dots = g.append("g").selectAll("circle").data(allPts).join("circle").attr("class", "mark")
        .attr("cx", function (d) { return x(d.p.anno); }).attr("cy", function (d) { return y(d.p.idx); })
        .attr("r", function (d) { return d.p.anno === last.anno ? 4.5 : 3.5; })
        .style("fill", function (d) { return d.s.color; }).style("stroke", "var(--bg)").attr("stroke-width", 1.5);
      dots.each(function (d) {
        R.enter(d3.select(this), phase, function (s) { s.style("opacity", 0); }, function (s) { s.style("opacity", 1); }, (x(d.p.anno) / w) * R.DUR);
      });

      // etichette dirette a destra
      var lab = g.append("g");
      SER.forEach(function (s) {
        var p = s.pts[s.pts.length - 1];
        var gl = lab.append("g").attr("transform", "translate(" + (x(p.anno) + 9) + "," + y(p.idx) + ")");
        gl.append("text").attr("class", "series-label").attr("dy", "0.35em").style("fill", s.color).text(s.name);
        gl.append("text").attr("class", "series-label--sub").attr("dy", "1.65em").text(fmt(p.idx, 0));
      });
      R.enter(lab, phase, function (s) { s.style("opacity", 0); }, function (s) { s.style("opacity", 1); }, R.DUR * 0.85);

      function activate(i) {
        var d = data[i], cx = x(d.anno);
        cross.attr("x1", cx).attr("x2", cx).style("opacity", 1);
        dots.attr("r", function (q) { return q.p.anno === d.anno ? 5.5 : (q.p.anno === last.anno ? 4.5 : 3.5); })
          .classed("is-dimmed", function (q) { return q.p.anno !== d.anno; });
        var pi = IT.pts[i], pm = MO.pts[i];
        tip.show(R.tipHTML({
          title: String(d.anno),
          rows: [
            ["Italia", fmt(pi.v, 0) + varTxt(pi)],
            ["Mondo", fmt(pm.v, 0) + varTxt(pm)]
          ],
          note: (i ? "Incidenti gravi noti; tra parentesi la variazione sul " + data[i - 1].anno + ". " : "Incidenti gravi noti. ") +
            "Indice: Italia " + fmt(pi.idx, 0) + ", Mondo " + fmt(pm.idx, 0)
        }), cx + m.left, y(pi.idx) + m.top);
      }
      clearActive = function () {
        cross.style("opacity", 0);
        dots.attr("r", function (q) { return q.p.anno === last.anno ? 4.5 : 3.5; }).classed("is-dimmed", false);
      };
      g.append("rect").attr("class", "hit").attr("x", -12).attr("y", -m.top).attr("width", w + 24).attr("height", h + m.top)
        .on("pointermove pointerdown", function (ev) {
          var px = d3.pointer(ev, g.node())[0];
          activate(d3.leastIndex(data, function (d) { return Math.abs(x(d.anno) - px); }));
        })
        .on("pointerleave", function (ev) { if (ev.pointerType === "mouse") { tip.hide(); clearActive(); } });
    });
  }).catch(function (e) { R.fail("#chart", e); });
})();
</script>
</body>
</html>
